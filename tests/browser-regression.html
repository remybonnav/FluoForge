<html lang="en">
<meta charset="utf-8">
<title>FluoForge browser regressions</title>
<style>
body{font:14px system-ui;background:#eef0f5;color:#172031;margin:16px}button{padding:10px 16px;margin-right:8px}pre{white-space:pre-wrap}iframe{width:1280px;height:850px;border:1px solid #b5bdc9;max-width:100%}
</style>
<h1>FluoForge browser regressions</h1>
<button data-suite="dev-interface-regression">Interface and real mouse drags</button>
<button data-suite="path-regression">Pen / Path</button>
<button data-suite="regression">Existing interactions</button>
<button data-suite="project-export-regression">Projects and exports</button>
<button data-suite="ui-fixes-regression">UI fixes (locks, text box, zoom, insets)</button>
<button data-suite="v024-regression">v0.24 (legacy projects, scale bars, crop to shape, pages)</button>
<button data-suite="zstack-regression">Z stacks and time series</button>
<button data-suite="about-regression">About dialog and licence notices</button>
<button data-suite="offline-regression">Offline: vendored libraries and CSP</button>
<button data-suite="module-api-regression">ES modules and the MFC API</button>
<button data-suite="image-info-regression">Quiet import and Image info</button>
<button data-suite="compat-regression">Old projects reopen; save as .fluoforge</button>
<button data-suite="errors-storage-regression">Errors, damaged files and storage</button>
<button data-suite="compositor-regression">Compositor: LUTs, gamma, resizing, worker</button>
<button data-suite="lut-calibration-regression">LUT library and calibration bar</button>
<button data-suite="histogram-display-regression">Histogram, auto contrast, copy display settings</button>
<button data-suite="comparison-regression">Comparison groups</button>
<button data-suite="file-formats-regression">File formats</button>
<button data-suite="figure-report-regression">Figure report</button>
<button data-suite="figure-check-regression">Figure check</button>
<button data-suite="vision-preview-regression">Colour-vision preview</button>
<pre id="result" role="status">Choose a suite. Each run uses a fresh test frame and isolated recovery storage.</pre>
<div id="frame"></div>
<script>
const suites={ 'dev-interface-regression':'runDevInterfaceRegressions', 'path-regression':'runPathRegressions',
  regression:'runMfcRegressions', 'project-export-regression':'runProjectExportRegressions',
  'ui-fixes-regression':'runUiFixesRegressions', 'v024-regression':'runV024Regressions',
  'zstack-regression':'runZStackRegressions', 'about-regression':'runAboutRegressions',
  'offline-regression':'runOfflineRegressions', 'module-api-regression':'runModuleApiRegressions',
  'image-info-regression':'runImageInfoRegressions', 'compat-regression':'runCompatRegressions',
  'errors-storage-regression':'runErrorsStorageRegressions', 'compositor-regression':'runCompositorRegressions',
  'lut-calibration-regression':'runLutCalibrationRegressions', 'histogram-display-regression':'runHistogramDisplayRegressions', 'comparison-regression':'runComparisonRegressions',
  'file-formats-regression':'runFileFormatsRegressions', 'figure-report-regression':'runFigureReportRegressions', 'figure-check-regression':'runFigureCheckRegressions', 'vision-preview-regression':'runVisionPreviewRegressions' };
document.querySelectorAll('button').forEach(button=>button.onclick=async()=>{
  const result=document.getElementById('result'); result.textContent='Running '+button.dataset.suite+'…';
  const frame=document.createElement('iframe');frame.src='../?test=regression-'+Date.now();document.getElementById('frame').replaceChildren(frame);
  try {
    await new Promise(resolve=>frame.onload=resolve);
    const win=frame.contentWindow;
    while(!win.document.getElementById('app-version').textContent)await new Promise(resolve=>setTimeout(resolve,50));
    const script=win.document.createElement('script');script.src='tests/'+button.dataset.suite+'.js?run='+Date.now();
    await new Promise((resolve,reject)=>{script.onload=resolve;script.onerror=reject;win.document.head.append(script);});
    const report=await win[suites[button.dataset.suite]]();
    const checks=Array.isArray(report)?report:report.checks;
    result.textContent='PASS — '+checks.length+' checks\n'+checks.join('\n');
  } catch(error){result.textContent='FAIL — '+String(error)+'\n'+(error.stack||'');console.error(error);}
});
</script>
</html>
