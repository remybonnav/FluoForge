</style>
<h1>FluoForge browser regressions</h1>
<button data-suite="dev-interface-regression">Interface and real mouse drags</button>

<button data-suite="about-regression">About dialog and licence notices</button>
<button data-suite="offline-regression">Offline: vendored libraries and CSP</button>

<button data-suite="legend-regression">Channel legend</button>
<button data-suite="crop-regression">Crop tool (square)</button>
<button data-suite="montage-regression">Quick figure (split-channel montage)</button>
<button data-suite="grid-regression">Layout grid</button>
<button data-suite="letters-regression">Panel letters</button>
<button data-suite="print-size-regression">Journal presets and print sizes</button>
<button data-suite="page-units-regression">Page size follows the unit</button>
<button data-suite="templates-regression">Templates and image replacement</button>

<button data-suite="annotate-regression">Microscopy annotations</button>
<button data-suite="series-regression">Series montages</button>
<button data-suite="calibration-regression">Calibration fields</button>
<button data-suite="vector-regression">Vector panels (SVG, PDF page)</button>
<button data-suite="pdf-vector-regression">PDF pages as vector panels</button>
<button data-suite="metafile-import-regression">EMF and WMF as vector panels</button>
<button data-suite="eps-import-regression">EPS as vector panels</button>

<button data-suite="linked-panels-regression">Linked panels highlighted, Link and Unlink explained</button>

<button data-suite="text-draw-snap-regression">Text boxes drawn to size, snapping when resized</button>
<pre id="result" role="status">Choose a suite. Each run uses a fresh test frame and isolated recovery storage.</pre>
<div id="frame"></div>
<script>
const suites={ 'dev-interface-regression':'runDevInterfaceRegressions', 'path-regression':'runPathRegressions', 'arrowhead-regression':'runArrowheadRegressions',
  regression:'runMfcRegressions', 'project-export-regression':'runProjectExportRegressions',
  'ui-fixes-regression':'runUiFixesRegressions', 'v024-regression':'runV024Regressions',
  'zstack-regression':'runZStackRegressions', 'about-regression':'runAboutRegressions',
  'offline-regression':'runOfflineRegressions', 'module-api-regression':'runModuleApiRegressions',
  'image-info-regression':'runImageInfoRegressions', 'compat-regression':'runCompatRegressions',
  'errors-storage-regression':'runErrorsStorageRegressions', 'compositor-regression':'runCompositorRegressions',
  'lut-calibration-regression':'runLutCalibrationRegressions', 'histogram-display-regression':'runHistogramDisplayRegressions', 'comparison-regression':'runComparisonRegressions',
  'file-formats-regression':'runFileFormatsRegressions', 'figure-report-regression':'runFigureReportRegressions', 'figure-check-regression':'runFigureCheckRegressions', 'vision-preview-regression':'runVisionPreviewRegressions', 'snapping-regression':'runSnappingRegressions', 'preferences-regression':'runPreferencesRegressions', 'export-upgrades-regression':'runExportUpgradesRegressions', 'copy-external-regression':'runCopyExternalRegressions', 'copy-entry-points-regression':'runCopyEntryPointsRegressions', 'legend-regression':'runLegendRegressions', 'crop-regression':'runCropRegressions', 'montage-regression':'runMontageRegressions', 'grid-regression':'runGridRegressions', 'letters-regression':'runLettersRegressions', 'print-size-regression':'runPrintSizeRegressions', 'page-units-regression':'runPageUnitsRegressions', 'templates-regression':'runTemplatesRegressions', 'guides-regression':'runGuidesRegressions', 'annotate-regression':'runAnnotateRegressions', 'series-regression':'runSeriesRegressions', 'calibration-regression':'runCalibrationRegressions', 'vector-regression':'runVectorRegressions', 'pdf-vector-regression':'runPdfVectorRegressions', 'metafile-import-regression':'runMetafileImportRegressions', 'eps-import-regression':'runEpsImportRegressions', 'inspector-regression':'runInspectorRegressions', 'channel-layout-regression':'runChannelLayoutRegressions', 'docprops-collapse-regression':'runDocpropsCollapseRegressions', 'contained-selection-regression':'runContainedSelectionRegressions', 'text-draw-snap-regression':'runTextDrawSnapRegressions', 'path-points-regression':'runPathPointsRegressions', 'adjust-crop-regression':'runAdjustCropRegressions', 'panel-info-regression':'runPanelInfoRegressions', 'linked-panels-regression':'runLinkedPanelsRegressions' };
document.querySelectorAll('button').forEach(button=>button.onclick=async()=>{
  const result=document.getElementById('result'); result.textContent='Running '+button.dataset.suite+'…';
  const frame=document.createElement('iframe');frame.src='../?test=regression-'+Date.now();document.getElementById('frame').replaceChildren(frame);
  try {
    await new Promise(resolve=>frame.onload=resolve);
    const win=frame.contentWindow;
    while(!win.document.getElementById('app-version').textContent)await new Promise(resolve=>setTimeout(resolve,50));
    const script=win.document.createElement('script');script.src='tests/'+button.dataset.suite+'.js?run='+Date.now();
    await new Promise((resolve,reject)=>{script.onload=resolve;script.onerror=reject;win.document.head.append(script);});
    const report=await win[suites[button.dataset.suite]]();
    const checks=Array.isArray(report)?report:report.checks;
    result.textContent='PASS — '+checks.length+' checks\n'+checks.join('\n');
  } catch(error){result.textContent='FAIL — '+String(error)+'\n'+(error.stack||'');console.error(error);}
});
</script>
</html>
