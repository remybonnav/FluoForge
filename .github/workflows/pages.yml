# Deploys the static app from main to GitHub Pages.
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Two jobs, as in GitHub's Pages starter workflow: "build" uploads the one github-pages artifact and
  # "deploy" publishes it. If only the deployment fails, "Re-run failed jobs" reruns just "deploy"
  # against the artifact already uploaded, instead of uploading another copy into the same run.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # The app needs no build: publish the repository as it is, without development-only files.
      - run: |
          mkdir -p _site
          cp -r index.html style.css js assets presets docs tools LICENSE COMMERCIAL-LICENSE.md THIRD-PARTY-NOTICES.md README.md _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
